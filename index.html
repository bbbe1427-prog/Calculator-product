
<!DOCTYPE html>

    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
</head>
<body>
      <div class="contain">
  <h2>Enter Product</h2>
  <form id="productForm">
    <label>Name:
      <input type="text" id="name">
    </label>
    <label>Quantity:
      <input type="number" id="qty">
    </label>
    <label>Unit Price:
      <input type="number" id="price">
    </label>
    <button type="button" onclick="nameprodu()">Calculator</button>
  </form>
</div>
  <h2 >Product Table</h2>
  <table>
    <tr><th>#</th><th>Name</th><th>Qty</th><th>Unit Price ($)</th><th>Total ($)</th></tr>
    <tbody id="showTable"></tbody>
  </table>

  <p id="subtotal"></p>
  <p id="discount"></p>
  <p id="finalTotal"></p>

</body>
